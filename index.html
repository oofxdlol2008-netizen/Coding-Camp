<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
  <!-- Flash-of-wrong-theme prevention: apply saved theme synchronously before any paint -->
  <script>
    (function () {
      try {
        var theme = JSON.parse(localStorage.getItem('dashboard_theme'));
        if (theme === 'dark' || theme === 'light') {
          document.documentElement.setAttribute('data-theme', theme);
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {
        // localStorage unavailable or JSON parse error — fall through to default light theme
      }
    })();
  </script>
</head>
<body>
  <main class="dashboard">
    <!-- Widget 1: Greeting with live clock -->
    <section id="greeting" class="widget" aria-label="Greeting and clock">
    </section>

    <!-- Widget 2: Pomodoro Focus Timer -->
    <section id="timer" class="widget" aria-label="Pomodoro timer">
    </section>

    <!-- Widget 3: To-Do List -->
    <section id="todo" class="widget" aria-label="To-do list">
    </section>

    <!-- Widget 4: Quick Links -->
    <section id="links" class="widget" aria-label="Quick links">
    </section>

    <!-- Widget 5: Theme Toggle -->
    <section id="theme-toggle" class="widget" aria-label="Theme toggle">
    </section>
  </main>

  <script src="js/app.js" defer></script>
  <div id="toast" class="toast hidden" aria-live="polite" role="status"></div>
</body>
</html>
